server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    gzip on;

    location /health {
        default_type application/json;
        return 200 '{"status":"ok","component":"live fight box"}';
    }

    location /reconstruct {
        proxy_pass http://helper:8000/reconstruct;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (do not append) so a client-supplied X-Forwarded-For chain
        # cannot spoof the helper's rate-limit key. $remote_addr is the peer.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 64k;
    }

    location / {
        try_files $uri /index.html;
    }
}
